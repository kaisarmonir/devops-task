apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devops-task

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

# secret.env is not committed: copy secret.env.example and fill it in.
# The name gets a content hash, so changing a value rolls the pods.
secretGenerator:
  - name: app-secret
    envs:
      - secret.env
