services:
  app:
    build:
      context: .
      args:
        VERSION: ${APP_VERSION:-1.0.0}
    image: devops-task-app:${APP_VERSION:-1.0.0}
    container_name: devops-task-app
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ENV: ${APP_ENV:-local}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - app

networks:
  app:
    name: app
