# Usage: ansible-playbook -i "<public ip>," site.yml
- name: Configure the app server
  hosts: all
  become: true
  # still reload sshd / apply sysctl when a later task fails
  force_handlers: true

  pre_tasks:
    # user_data installs docker on first boot, wait until it is done
    - name: Wait for cloud-init
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init
      changed_when: false
      failed_when: cloud_init.rc not in [0, 2]

  tasks:
    - name: Basic hardening
      ansible.builtin.import_tasks: tasks/hardening.yml
      tags: hardening

    - name: Health script and timer
      ansible.builtin.import_tasks: tasks/health.yml
      tags: health

    - name: Monitoring stack
      ansible.builtin.import_tasks: tasks/monitoring.yml
      tags: monitoring

  handlers:
    - name: Check sshd config
      ansible.builtin.command: sshd -t
      changed_when: false
      listen: Reload sshd

    - name: Reload sshd service
      ansible.builtin.systemd_service:
        name: sshd
        state: reloaded
      listen: Reload sshd

    - name: Apply sysctl
      ansible.builtin.command: sysctl -p /etc/sysctl.d/90-hardening.conf
      changed_when: true
