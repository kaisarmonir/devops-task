- name: Install health script
  ansible.builtin.copy:
    src: "{{ repo_root }}/scripts/system_health.sh"
    dest: /usr/local/bin/system_health.sh
    mode: "0755"

- name: Install systemd service and timer
  ansible.builtin.copy:
    src: "{{ repo_root }}/systemd/{{ item }}"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - system-health.service
    - system-health.timer

- name: Install logrotate config
  ansible.builtin.copy:
    src: "{{ repo_root }}/systemd/system-health.logrotate"
    dest: /etc/logrotate.d/system-health
    mode: "0644"

- name: Enable health timer
  ansible.builtin.systemd_service:
    name: system-health.timer
    enabled: true
    state: started
    daemon_reload: true
